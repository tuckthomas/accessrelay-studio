name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.x'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.25.0'
      - name: Install desktop interface dependencies
        run: pnpm --dir ./src/AccessRelayStudio/DesktopUi install --frozen-lockfile
      - name: Check desktop interface workflows
        run: pnpm --dir ./src/AccessRelayStudio/DesktopUi test
      - name: Build the bundled desktop interface
        run: ./scripts/Build-DesktopUi.ps1
      - name: Publish the base app
        run: dotnet publish ./src/AccessRelayStudio/AccessRelayStudio.csproj -c Release -o ./artifacts/Run
      - name: Check compiled engine, runtime and desktop boundaries
        run: dotnet run --project ./tools/architecture/Verification/ProjectBoundaryVerification.csproj -c Release -- ./artifacts/Run/AccessRelayStudio.Engine.dll ./artifacts/Run/AccessRelayStudio.Runtime.dll ./artifacts/Run/AccessRelayStudio.dll ./artifacts/Run/AccessRelayStudio.Application.dll
      - name: Check published desktop and worker assets
        shell: pwsh
        run: |
          $required = @('AccessRelayStudio.exe', 'AccessRelayStudio.Engine.dll', 'AccessRelayStudio.Runtime.dll',
            'Microsoft.ML.OnnxRuntime.dll', 'onnxruntime.dll', 'onnxruntime_providers_shared.dll', 'onnxruntime_providers_cuda.dll',
            'NAudio.Wasapi.dll', 'System.Speech.dll', 'DesktopUi/index.html', 'Scene/Viewer/index.html',
            'Scene/Viewer/viewer.bundle.js', 'Scene/Model/XboxOne.glb', 'GamePacks/nba2k27/pack.json', 'GamePacks/switch-demo/pack.json',
            'AccessRelayStudio.Application.dll', 'Mcp/AccessRelayStudio.Mcp.exe', 'Mcp/AccessRelayStudio.Mcp.dll',
            'Mcp/TrainingTools/Audit-VisionDataset.py', 'Mcp/TrainingTools/Run-VisionExperiments.py', 'Mcp/Notices/ModelContextProtocol-LICENSE.txt')
          foreach ($relative in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path ./artifacts/Run $relative) -PathType Leaf)) {
              throw "Published asset is missing: $relative"
            }
          }
          foreach ($entry in @(
            @{ Source = './src/AccessRelayStudio/Audio/VirtualMicHost/AccessRelay.VirtualMicHost.exe'; Target = 'VirtualMicrophone/AccessRelay.VirtualMicHost.exe' },
            @{ Source = './src/AccessRelayStudio/Audio/VirtualMicHost/AccessRelay.VirtualXboxHost.exe'; Target = 'VirtualController/AccessRelay.VirtualXboxHost.exe' }
          )) {
            if (Test-Path -LiteralPath $entry.Source -PathType Leaf) {
              $copied = Join-Path ./artifacts/Run $entry.Target
              if (-not (Test-Path -LiteralPath $copied -PathType Leaf) -or (Get-FileHash $entry.Source).Hash -ne (Get-FileHash $copied).Hash) {
                throw "Staged helper was not preserved: $($entry.Target)"
              }
            }
          }
      - name: Check controller logic and profiles
        run: dotnet run --project ./src/AccessRelayStudio/Verification/Verification.csproj -c Release
      - name: Check actual D3D11 RGB shader parity and GPU frame ownership
        run: dotnet run --project ./src/AccessRelayStudio/WindowsVerification/WindowsVerification.csproj -c Release -- --gpu-preprocessing-only
      - name: Check actual MCP SDK, private IPC, drafts, workers and offline jobs
        shell: pwsh
        run: dotnet run --project ./tools/assistant/Verification/AssistantVerification.csproj -c Release -- --bridge ./artifacts/Run/Mcp/AccessRelayStudio.Mcp.exe --python (Get-Command python).Source
      - name: Check offline dataset provenance guards
        run: python -S -m unittest discover -s ./tools/vision -p 'test_*.py' -v
      - name: Check desktop binary media and evidence integrity
        run: dotnet run --project ./tools/desktop/Verification/DesktopEvidenceVerification.csproj -c Release
      - name: Check vision contracts, model library and performance imports
        run: dotnet run --project ./tools/vision/Verification/VisionModelVerification.csproj -c Release
      - name: Build physical input diagnostics
        run: dotnet build ./src/AccessRelayStudio/Input/Probe/EliteInputProbe.csproj -c Release
      - name: Check pending physical acceptance journal generation
        shell: pwsh
        run: |
          ./scripts/Start-AccessibilityAcceptance.ps1 -AppPath ./artifacts/Run/AccessRelayStudio.exe -OutDirectory ./artifacts/acceptance-template -TemplateOnly
          $cases = Import-Csv ./artifacts/acceptance-template/cases.csv
          if ($cases.Count -ne 20 -or @($cases | Where-Object status -ne 'Pending').Count -ne 0) {
            throw 'The physical acceptance journal must start with 20 pending cases.'
          }
      - name: Check native runtime with simulated devices
        run: dotnet run --project ./src/AccessRelayStudio/WindowsVerification/WindowsVerification.csproj -c Release -- --no-capture
      - name: Check native helpers
        run: cargo test --locked --manifest-path ./src/AccessRelayStudio/Audio/VirtualMicHost/Cargo.toml
