name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.x'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.25.0'
      - name: Install desktop interface dependencies
        run: pnpm --dir ./src/AccessRelayStudio/DesktopUi install --frozen-lockfile
      - name: Check desktop interface workflows
        run: pnpm --dir ./src/AccessRelayStudio/DesktopUi test
      - name: Build the bundled desktop interface
        run: ./scripts/Build-DesktopUi.ps1
      - name: Publish the base app
        run: dotnet publish ./src/AccessRelayStudio/AccessRelayStudio.csproj -c Release -o ./artifacts/Run
      - name: Check controller logic and profiles
        run: dotnet run --project ./src/AccessRelayStudio/Verification/Verification.csproj -c Release
      - name: Check offline dataset provenance guards
        run: python -S -m unittest discover -s ./tools/vision -p test_dataset_validation.py -v
      - name: Check desktop binary media and evidence integrity
        run: dotnet run --project ./tools/desktop/Verification/DesktopEvidenceVerification.csproj -c Release
      - name: Check native runtime with simulated devices
        run: dotnet run --project ./src/AccessRelayStudio/WindowsVerification/WindowsVerification.csproj -c Release -- --no-capture
      - name: Check native helpers
        run: cargo test --locked --manifest-path ./src/AccessRelayStudio/Audio/VirtualMicHost/Cargo.toml
