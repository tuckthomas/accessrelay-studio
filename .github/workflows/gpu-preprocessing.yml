name: Windows GPU preprocessing correctness
on:
  push:
    paths:
      - 'src/AccessRelayStudio/Vision/**'
      - 'src/AccessRelayStudio/WindowsVerification/**'
      - 'src/AccessRelayStudio.Runtime/**'
      - '.github/workflows/gpu-preprocessing.yml'
  pull_request:
    paths:
      - 'src/AccessRelayStudio/Vision/**'
      - 'src/AccessRelayStudio/WindowsVerification/**'
      - 'src/AccessRelayStudio.Runtime/**'
      - '.github/workflows/gpu-preprocessing.yml'
permissions:
  contents: read
jobs:
  shader:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Check actual D3D11 WARP shader parity and GPU ownership
        run: dotnet run --project ./src/AccessRelayStudio/WindowsVerification/WindowsVerification.csproj -c Release -- --gpu-preprocessing-only
      - name: Record CUDA capability without claiming hardware acceptance
        shell: pwsh
        run: |
          dotnet run --project ./src/AccessRelayStudio/WindowsVerification/WindowsVerification.csproj -c Release -- --cuda-preprocessing-probe
          $probeExit = $LASTEXITCODE
          if ($probeExit -eq 2) {
            Write-Host 'CUDA unavailable on this runner. NVIDIA interoperability and inference remain unverified.'
            exit 0
          }
          if ($probeExit -eq 3) {
            Write-Host 'CUDA tensor probe passed; actual model inference was not requested. Hardware acceptance remains open.'
            exit 0
          }
          exit $probeExit
