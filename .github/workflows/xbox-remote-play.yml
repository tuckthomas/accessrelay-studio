name: Xbox Remote Play
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-webrtc:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Install the optional Windows media runtime
        run: ./scripts/Install-XboxRemotePlay.ps1
      - name: Verify native H.264 reception and paddle output between WebRTC peers
        run: dotnet run --project ./src/AccessRelayStudio/WindowsVerification -c Release -- --xbox-webrtc-loopback
